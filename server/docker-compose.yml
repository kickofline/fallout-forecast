# Fallout Forecast dedicated server. See server/README.md.
# WebSockets use ports 7777 and 7780. Open Protocol raw TCP uses 7781.
services:
  fallout-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: fallout-server:${FALLOUT_TAG:-latest}
    container_name: fallout-server
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    environment:
      FALLOUT_THIN_JOIN_CODE: ${FALLOUT_THIN_JOIN_CODE:-}
      FALLOUT_TRUSTED_PROXIES: ${FALLOUT_TRUSTED_PROXIES:-}
    ports:
      - "7777:7777"
      - "7780:7780"
      - "7781:7781"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
